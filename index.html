<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria Worldbuilder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Horní lišta s názvem -->
  <header class="app-header">
    <h1>Aetheria</h1>
  </header>

  <!-- Hlavní obsahový prostor -->
  <main id="app-content" class="content-container">
    
    <!-- Sekce: Čtení (Výchozí) -->
    <section id="cteni" class="tab-content active">
      <h2>Příběh & Čtení</h2>
      <div class="card">
        <h3>Vítejte v Aetherii</h3>
        <p>Zde můžete číst příběhy, záznamy ze světa a hlavní lore.</p>
      </div>
    </section>

    <!-- Sekce: Mapa -->
    <section id="mapa" class="tab-content">
      <h2>Mapa Světa</h2>
      <div class="card map-placeholder">
        <p>🗺️ [Zde bude interaktivní mapa Aetherie]</p>
      </div>
    </section>

    <!-- Sekce: Lokality -->
    <section id="lokality" class="tab-content">
      <h2>Města a Lokality</h2>
      <div id="cities-list" class="items-grid"></div>
    </section>

    <!-- Sekce: Postavy -->
    <section id="postavy" class="tab-content">
      <h2>Postavy</h2>
      <div id="characters-list" class="items-grid"></div>
    </section>

    <!-- Sekce: Bestiář -->
    <section id="bestiar" class="tab-content">
      <h2>Bestiář</h2>
      <div id="bestiary-list" class="items-grid"></div>
    </section>

  </main>

  <!-- Spodní mobilní navigace podle vašeho designu -->
  <nav class="mobile-nav">
    <div class="nav-container">
      
      <!-- Vlevo -->
      <button class="nav-item" onclick="switchTab('mapa', this)">
        <span class="icon">🗺️</span>
        <span class="label">Mapa</span>
      </button>
      
      <button class="nav-item" onclick="switchTab('lokality', this)">
        <span class="icon">🏰</span>
        <span class="label">Lokality</span>
      </button>

      <!-- Uprostřed: Hlavní tlačítko Čtení -->
      <div class="center-button-wrapper">
        <button class="nav-item center-btn active" onclick="switchTab('cteni', this)">
          <span class="icon">📖</span>
        </button>
      </div>

      <!-- Vpravo -->
      <button class="nav-item" onclick="switchTab('postavy', this)">
        <span class="icon">🧙‍♂️</span>
        <span class="label">Postavy</span>
      </button>

      <button class="nav-item" onclick="switchTab('bestiar', this)">
        <span class="icon">🐉</span>
        <span class="label">Bestiář</span>
      </button>

    </div>
  </nav>

  <script src="script.js"></script>
</body>
</html>
